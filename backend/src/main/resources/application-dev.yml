# Local development profile (active by default via `spring.profiles.default`).
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

memora:
  security:
    jwt:
      # Insecure, intentionally public, local-only fallback so `mvn spring-boot:run`
      # works without exporting anything. Overridden by MEMORA_SECURITY_JWT_SECRET.
      # Any other profile has no default and will refuse to start without one.
      secret: ${MEMORA_SECURITY_JWT_SECRET:dev-only-insecure-signing-secret-do-not-use-anywhere-else}

logging:
  level:
    com.memora: DEBUG
    org.hibernate.SQL: DEBUG
