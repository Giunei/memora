<div class="relative flex min-h-dvh flex-col bg-canvas">
  <div class="pointer-events-none absolute inset-0 glow-violet"></div>

  <header class="relative z-10 flex items-center justify-between px-4 py-5 sm:px-8">
    <app-brand />
    <a routerLink="/register" class="text-sm text-ink-muted hover:text-ink">Criar conta</a>
  </header>

  <main class="relative z-10 flex flex-1 items-center justify-center px-4 pb-16">
    <form
      class="card-sheen w-full max-w-md p-6 sm:p-8"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <p class="kicker">Acesso</p>
      <h1 class="mt-3 font-display text-2xl font-semibold tracking-tight">Entrar no Memora</h1>
      <p class="mt-2 text-sm text-ink-muted">
        Continue de onde parou. Sua sessão fica neste dispositivo.
      </p>

      <label class="label mt-8" for="email">E-mail</label>
      <input
        id="email"
        class="field"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="voce@email.com"
      />

      <label class="label mt-5" for="password">Senha</label>
      <div class="relative">
        <input
          id="password"
          class="field pr-12"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-1 grid w-10 place-items-center text-ink-subtle hover:text-ink"
          (click)="showPassword.update((visible) => !visible)"
          [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16" />
        </button>
      </div>

      @if (errorMessage(); as message) {
        <p class="mt-4 rounded-field bg-rose/10 px-3 py-2 text-sm text-rose" role="alert">
          {{ message }}
        </p>
      }

      <button class="btn-primary mt-6 w-full" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <app-icon name="loader" [size]="16" class="animate-spin" />
          Entrando…
        } @else {
          Entrar
        }
      </button>
    </form>
  </main>
</div>
